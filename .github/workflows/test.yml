name: Test and package universal preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q toolbox tests start.py

  package:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/universal-proxy' || startsWith(github.ref, 'refs/tags/v0.2.0-preview.')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependency
        run: python -m pip install ".[build]"
      - name: Build separate preview folder
        shell: pwsh
        run: ./scripts/build-universal.ps1
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -LiteralPath dist-universal/WSL-Drive-Toolbox-Universal -DestinationPath dist-universal/WSL-Drive-Toolbox-Universal-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WSL-Drive-Toolbox-Universal-windows
          path: dist-universal/WSL-Drive-Toolbox-Universal-windows.zip
          if-no-files-found: error

name: Test and package Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q toolbox tests start.py

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependency
        run: python -m pip install ".[build]"
      - name: Build executable and release ZIP
        shell: pwsh
        run: ./scripts/build.ps1 -DistPath dist -ReleaseZip
      - uses: actions/upload-artifact@v4
        with:
          name: WSL-Drive-Toolbox-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsl-drive-toolbox"
version = "0.2.0"
description = "Connect WSL to the current Windows proxy and safely eject external drives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WSL Drive Toolbox contributors"}]
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6,<7; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["toolbox*"]
